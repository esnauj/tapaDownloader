[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tapa-downloader"
version = "5.0.0"
description = "Descargador y preparador de portadas de álbumes"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31,<3",
    "Pillow>=10.0,<13",
]

[project.scripts]
tapa-downloader = "tapa_downloader.app:main"

[tool.setuptools.packages.find]
include = ["tapa_downloader*"]
